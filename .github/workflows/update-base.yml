name: Update fsdk-containers base

# Keep the fsdk-containers junction (and with it FSDK and the shared printing
# base) current. FSDK is reached only through fsdk-containers, so this is the
# one dependency updater for it.
on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:

concurrency:
  group: update-base
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  update:
    name: Track fsdk-containers
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      BST_FLAGS: --config /src/ci/buildstream.conf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: testing
          persist-credentials: false
      - uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2
        with:
          tool: just
      - name: Install host dependencies
        run: sudo apt-get update && sudo apt-get install --yes fuse3 podman
      - name: Track fsdk-containers
        id: track
        run: |
          set -euo pipefail
          junction=elements/fsdk-containers.bst
          commit() { sed -n -E 's/^ +ref: .*([0-9a-f]{40})$/\1/p' "$junction"; }
          old="$(commit)"
          just bst source track fsdk-containers.bst
          new="$(commit)"
          [[ "$old" =~ ^[0-9a-f]{40}$ && "$new" =~ ^[0-9a-f]{40}$ ]]
          # Keep the ref a plain commit: git_repo's project-wide git-describe
          # format would otherwise rewrite the same commit as a change.
          git checkout -- "$junction"
          if [[ "$new" == "$old" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            sed -i -E "s/^( +ref: ).*$/\1${new}/" "$junction"
            {
              echo "changed=true"
              echo "old=${old}"
              echo "new=${new}"
            } >> "$GITHUB_OUTPUT"
          fi
      - name: Synchronize source metadata
        if: steps.track.outputs.changed == 'true'
        env:
          OLD: ${{ steps.track.outputs.old }}
          NEW: ${{ steps.track.outputs.new }}
        run: |
          set -euo pipefail
          mkdir -p .bst/update-evidence
          python3 scripts/sync-fsdk-metadata.py --old "$OLD" --new "$NEW" |
            tee .bst/update-evidence/sources.txt
      - name: Verify candidate before write credentials
        if: steps.track.outputs.changed == 'true'
        run: |
          set -euo pipefail
          python3 tests/fsdk-metadata.py
          just verify-cups-patch-chain 2>&1 | tee .bst/update-evidence/patch-chain.log
          just fetch 2>&1 | tee .bst/update-evidence/fetch.log
          just verify 2>&1 | tee .bst/update-evidence/verify.log
      # BuildStream's session summaries distinguish local cache, remote pulls
      # and local builds. Keep the actual results, including failed runs.
      - name: Retain source and cache evidence
        if: always() && steps.track.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fsdk-update-evidence
          path: .bst/update-evidence/
          include-hidden-files: true
      - name: Mint Mergeraptor token
        if: steps.track.outputs.changed == 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.MERGERAPTOR_APP_ID }}
          private-key: ${{ secrets.MERGERAPTOR_PRIVATE_KEY }}
          # A fork's per-repo installation lookup (GET /repos/{owner}/{repo}/installation) 404s;
          # owner: switches to the owner-level lookup, which resolves from a fork (fsdk-containers#331).
          owner: ${{ github.repository_owner }}
      - name: Propose the update
        if: steps.track.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          OLD: ${{ steps.track.outputs.old }}
          NEW: ${{ steps.track.outputs.new }}
        run: |
          set -euo pipefail
          branch=deps/fsdk-containers
          title="chore(deps): update fsdk-containers to ${NEW:0:12}"
          git config user.name 'mergeraptor[bot]'
          git config user.email '267480593+mergeraptor[bot]@users.noreply.github.com'
          git switch --create "$branch"
          git add elements/fsdk-containers.bst VERSION elements/printer-app/ijs.bst \
            elements/oci/ghostscript-printer-app.bst README.md
          git commit --signoff -m "$title"
          basic="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$basic"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $basic" \
            push --force "https://github.com/${REPOSITORY}.git" "HEAD:refs/heads/$branch"
          body="Moves the fsdk-containers junction (FSDK and the shared printing base) from ${OLD} to ${NEW}: https://github.com/projectbluefin/fsdk-containers/compare/${OLD}...${NEW}"
          body_file="$(mktemp)"
          {
            printf '%s\n\n' "$body"
            cat .bst/update-evidence/sources.txt
            printf '\nVerified with patch-chain, fetch and full OCI socket-sink gates on x86_64. Physical paper output remains unverified.\n'
            printf '\nSource/cache evidence: https://github.com/%s/actions/runs/%s (fsdk-update-evidence artifact). Native arm64 verification remains a merge-queue gate.\n' "$REPOSITORY" "$GITHUB_RUN_ID"
          } > "$body_file"
          if existing="$(gh pr list --head "$branch" --base testing --state open --json number --jq '.[0].number')" && [[ -n "$existing" ]]; then
            gh pr edit "$existing" --title "$title" --body-file "$body_file"
            printf 'Updated dependency PR #%s\n' "$existing"
          else
            gh pr create --base testing --head "$branch" --title "$title" --body-file "$body_file"
          fi
